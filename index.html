<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Stock Study</title>
  <meta name="description" content="매일 저녁 주식 개념 1강을 실제 뉴스 사례와 함께 배우는 개인용 주식 공부 앱. 교육용 정보이며 투자 권유가 아닙니다.">
  <!-- 같은 출처의 파일만 불러오고, 다른 서버로는 아무것도 보내지 못하게 막는다(일지 등 개인 기록 보호). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f5bea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10141f" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="주식공부">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">본문으로 건너뛰기</a>
  <div id="app">
    <main id="view" tabindex="-1">
      <p class="loading" role="status">불러오는 중…</p>
    </main>
  </div>

  <nav id="tabbar" aria-label="주요 메뉴">
    <a href="#/today" data-tab="today" data-label="오늘" aria-label="오늘">
      <span class="tab-icon" aria-hidden="true">📘</span><span class="tab-text">오늘</span>
    </a>
    <a href="#/review" data-tab="review" data-label="복습" aria-label="복습">
      <span class="tab-icon" aria-hidden="true">🔁</span><span class="tab-text">복습</span>
      <span class="tab-badge" hidden></span>
    </a>
    <a href="#/journal" data-tab="journal" data-label="일지" aria-label="일지">
      <span class="tab-icon" aria-hidden="true">📒</span><span class="tab-text">일지</span>
      <span class="tab-badge" hidden></span>
    </a>
    <a href="#/calc" data-tab="calc" data-label="계산기" aria-label="계산기">
      <span class="tab-icon" aria-hidden="true">🧮</span><span class="tab-text">계산기</span>
    </a>
    <a href="#/settings" data-tab="settings" data-label="설정" aria-label="설정">
      <span class="tab-icon" aria-hidden="true">⚙️</span><span class="tab-text">설정</span>
    </a>
  </nav>

  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>
    <p class="noscript">이 앱은 자바스크립트가 켜져 있어야 동작합니다.</p>
  </noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
